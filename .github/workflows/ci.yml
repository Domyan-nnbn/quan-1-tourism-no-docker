name: Quality checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  mobile:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Mobile tests with report
        run: |
          mkdir -p reports
          node --import tsx --test --test-reporter=junit src/*.test.ts > reports/mobile-junit.xml
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-checks-${{ github.sha }}
          path: |
            mobile/reports/
            mobile/dist/metadata.json
          if-no-files-found: warn
          retention-days: 30
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://tourism:ci-test-password@localhost:5432/tourism_test
      JWT_SECRET: ci-only-secret-012345678901234567890123456789
      ADMIN_PASSWORD: integration-test-only-password
      SEED_DEMO: 'false'
      NATIVE_POSTGRES: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Start native PostgreSQL (no Docker)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER tourism PASSWORD 'ci-test-password';"
          sudo -u postgres createdb -O tourism tourism_test
      - run: pip install -r requirements.lock
      - run: python -m pytest -q --junitxml=reports/backend-junit.xml
      - name: Export API contract
        run: python ../scripts/export_openapi.py reports/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks-${{ github.sha }}
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 30
